  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --green: #00ff66;
      --cyan: #00f0ff;
      --red: #ff3333;
      --yellow: #ffbd2e;
      --text: #e6edf3;
      --muted: #8b949e;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', Consolas, 'Courier New', monospace;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .terminal-shell {
      width: 100%;
      max-width: 960px;
      height: calc(100vh - 32px);
      max-height: 760px;
      background: var(--panel);
      border: 1.5px solid var(--green);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 0 32px rgba(0, 255, 102, 0.12);
      position: relative;
    }

    .titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      background: #0f141b;
      gap: 12px;
      flex-wrap: wrap;
    }

    .titlebar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dots {
      display: flex;
      gap: 6px;
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
    }

    .dot.red { background: var(--red); }
    .dot.yellow { background: var(--yellow); }
    .dot.green { background: var(--green); }

    .title-text {
      color: var(--muted);
      font-size: 12.5px;
      font-weight: 600;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button {
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    button:hover {
      border-color: var(--cyan);
      color: var(--cyan);
    }

    button.active {
      border-color: var(--green);
      color: var(--bg);
      background: var(--green);
    }

    button.restart {
      border-color: var(--cyan);
      color: var(--cyan);
    }

    button.restart:hover {
      background: var(--cyan);
      color: var(--bg);
    }

    #output {
      flex: 1;
      padding: 18px 20px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 13.5px;
      line-height: 1.45;
      color: var(--green);
    }

    .line-system { color: var(--cyan); }
    .line-error { color: var(--red); }
    .line-input-echo { color: var(--text); opacity: 0.9; }

    .input-bar {
      display: flex;
      align-items: center;
      padding: 12px 18px;
      border-top: 1px solid var(--border);
      background: #0d1117;
      gap: 10px;
    }

    .prompt-prefix {
      color: var(--cyan);
      font-weight: 700;
      user-select: none;
    }

    #cmd-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      caret-color: var(--green);
    }

    #cmd-input:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .status-pill {
      font-size: 11px;
      color: var(--muted);
    }
  </style>
</head>

  <script src="https://cdn.jsdelivr.net/pyodide/v0.27.5/full/pyodide.js"></script>
  <script>
    const outputEl = document.getElementById("output");
    const inputEl = document.getElementById("cmd-input");
    const statusEl = document.getElementById("status-pill");
    const titleEl = document.getElementById("title-label");

    let pyodide = null;
    let currentLang = new URLSearchParams(window.location.search).get("lang") === "en" ? "en" : "de";
    let pendingResolver = null;
    let runToken = 0;

    function updateLangButtons() {
      document.getElementById("btn-de").classList.toggle("active", currentLang === "de");
      document.getElementById("btn-en").classList.toggle("active", currentLang === "en");
      titleEl.textContent = currentLang === "de"
        ? "slopnet_os // main - DE Final.py"
        : "slopnet_os // main - EN Final.py";
      document.documentElement.lang = currentLang;
    }

    function appendText(text, className = "") {
      const span = document.createElement("span");
      if (className) span.className = className;
      span.textContent = text;
      outputEl.appendChild(span);
      outputEl.scrollTop = outputEl.scrollHeight;
    }

    window.js_print = (text) => {
      appendText(text);
    };

    window.js_input = (promptText, myToken) => {
      if (promptText) appendText(promptText);
      if (myToken !== runToken) {
        return Promise.reject(new Error("Game restarted"));
      }
      inputEl.disabled = false;
      inputEl.placeholder = currentLang === "de"
        ? "Eingabe tippen & Enter drücken..."
        : "Type input & press Enter...";
      statusEl.textContent = "AWAITING INPUT";
      inputEl.focus();

      return new Promise((resolve) => {
        pendingResolver = { resolve, token: myToken };
      });
    };

    function submitInput(event) {
      event.preventDefault();
      if (!pendingResolver) return;
      const val = inputEl.value;
      inputEl.value = "";
      inputEl.disabled = true;
      statusEl.textContent = "RUNNING";
      appendText(val + "\n", "line-input-echo");
      const { resolve } = pendingResolver;
      pendingResolver = null;
      resolve(val);
    }

    async function initPyodide() {
      appendText(">_ Booting SLOPNET_OS Python Runtime (Pyodide)...\n", "line-system");
      pyodide = await loadPyodide();
      await pyodide.runPythonAsync(`
import ast
import builtins
import sys
from js import js_print, js_input

class _WebStdout:
    def write(self, s):
        if s:
            js_print(str(s))
    def flush(self):
        pass

sys.stdout = _WebStdout()
sys.stderr = _WebStdout()

class _AsyncInputTransformer(ast.NodeTransformer):
    def visit_Call(self, node):
        self.generic_visit(node)
        if isinstance(node.func, ast.Name) and node.func.id == "input":
            return ast.Await(
                value=ast.Call(
                    func=ast.Name(id="web_input", ctx=ast.Load()),
                    args=node.args,
                    keywords=node.keywords,
                )
            )
        return node

def _compile_async_game(source_code):
    tree = ast.parse(source_code)
    tree = _AsyncInputTransformer().visit(tree)
    async_fn = ast.AsyncFunctionDef(
        name="__game_main__",
        args=ast.arguments(posonlyargs=[], args=[], kwonlyargs=[], kw_defaults=[], defaults=[]),
        body=tree.body,
        decorator_list=[],
        returns=None,
    )
    mod = ast.Module(body=[async_fn], type_ignores=[])
    ast.fix_missing_locations(mod)
    return ast.unparse(mod)
      `);
    }

    async function runGame() {
      const myToken = ++runToken;
      if (pendingResolver) {
        const prev = pendingResolver;
        pendingResolver = null;
        prev.resolve(null);
      }

      outputEl.innerHTML = "";
      inputEl.disabled = true;
      inputEl.value = "";
      updateLangButtons();

      if (!pyodide) {
        statusEl.textContent = "LOADING";
        await initPyodide();
      }

      if (myToken !== runToken) return;

      const source = document.getElementById(currentLang === "de" ? "code-de" : "code-en").textContent;
      statusEl.textContent = "RUNNING";

      pyodide.globals.set("current_run_token", myToken);
      await pyodide.runPythonAsync(`
class _GameRestarted(BaseException):
    pass

async def web_input(prompt=""):
    res = await js_input(str(prompt), current_run_token)
    if res is None:
        raise _GameRestarted()
    return res
      `);

      try {
        pyodide.globals.set("__raw_source__", source);
        await pyodide.runPythonAsync(`
__transformed__ = _compile_async_game(__raw_source__)
exec(__transformed__, globals())
try:
    await __game_main__()
except _GameRestarted:
    pass
        `);
        if (myToken === runToken) {
          appendText("\n>_ [PROCESS FINISHED — CLICK RESTART TO PLAY AGAIN]\n", "line-system");
          statusEl.textContent = "FINISHED";
          inputEl.disabled = true;
          inputEl.placeholder = "Game finished. Click Restart.";
        }
      } catch (err) {
        if (myToken === runToken && !String(err).includes("Game restarted")) {
          appendText("\n[RUNTIME ERROR]\n" + err + "\n", "line-error");
          statusEl.textContent = "ERROR";
          inputEl.disabled = true;
        }
      }
    }

    function switchLang(lang) {
      if (lang === currentLang && pyodide) return;
      currentLang = lang;
      const url = new URL(window.location);
      url.searchParams.set("lang", lang);
      window.history.replaceState({}, "", url);
      runGame();
    }

    function restartGame() {
      runGame();
    }

    updateLangButtons();
    runGame();
  </script>
